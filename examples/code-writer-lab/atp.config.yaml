# atp.config.yaml — конфигурация ATP для Code Writer Agents
log_level: INFO
parallel_workers: 2
default_timeout: 60
fail_fast: false
sandbox_enabled: false
runs_per_test: 1

# LLM (для llm_eval assertions)
anthropic_api_key: ${ANTHROPIC_API_KEY}
default_llm_model: claude-sonnet-4-20250514
default_provider: anthropic
max_retries: 3
request_timeout: 60

# Агенты
agents:
  - name: "openai-coder"
    type: "http"
    config:
      endpoint: "http://localhost:8001"
      timeout: 60

  - name: "anthropic-coder"
    type: "http"
    config:
      endpoint: "http://localhost:8002"
      timeout: 60

# Game-агент (опционально, для теоретико-игровой оценки)
# Запуск: uv run uvicorn agents.game_agent:app --port 8010
