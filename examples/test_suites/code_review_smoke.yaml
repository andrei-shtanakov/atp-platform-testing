# Smoke-тесты для Code Review Agent
# Запуск:
#   uv run atp test examples/test_suites/code_review_smoke.yaml \
#     --adapter=http \
#     --adapter-config='endpoint=http://localhost:8000/review'

test_suite: "code_review_smoke"
version: "1.0"
description: "Базовые проверки работоспособности Code Review Agent"

defaults:
  runs_per_test: 1
  timeout_seconds: 60
  constraints:
    max_steps: 5
    max_tokens: 10000
    timeout_seconds: 60
    budget_usd: 0.20
  scoring:
    quality_weight: 0.3
    completeness_weight: 0.5
    efficiency_weight: 0.2
    cost_weight: 0.0

agents:
  - name: "code-review-agent"
    type: "http"
    config:
      endpoint: "${API_ENDPOINT:http://localhost:8000/review}"
      timeout: 60

tests:
  - id: "SM-001"
    name: "Агент отвечает на запрос с кодом"
    tags: ["smoke", "critical"]
    task:
      description: "Review this Python function for bugs and style issues"
      input_data:
        code: |
          def add(a, b):
              return a + b
        language: "python"
      expected_artifacts: ["review.json"]
    assertions:
      - type: "artifact_exists"
        config:
          path: "review.json"
      - type: "behavior"
        config:
          check: "no_errors"

  - id: "SM-002"
    name: "Ответ соответствует JSON Schema"
    tags: ["smoke", "critical"]
    task:
      description: "Review this Python code and return structured report"
      input_data:
        code: |
          def greet(name):
              print(f"Hello, {name}!")
        language: "python"
      expected_artifacts: ["review.json"]
    assertions:
      - type: "artifact_exists"
        config:
          path: "review.json"
      - type: "schema"
        config:
          path: "review.json"
          schema:
            type: object
            required: ["summary", "issues", "metrics"]
            properties:
              summary:
                type: string
              issues:
                type: array
              metrics:
                type: object
                required: ["total_issues"]
                properties:
                  total_issues:
                    type: integer
                    minimum: 0

  - id: "SM-003"
    name: "Агент находит SQL injection"
    tags: ["smoke", "critical", "security"]
    task:
      description: "Review this code for security vulnerabilities"
      input_data:
        code: |
          import sqlite3

          def get_user(username):
              conn = sqlite3.connect("app.db")
              cursor = conn.cursor()
              query = f"SELECT * FROM users WHERE name = '{username}'"
              cursor.execute(query)
              return cursor.fetchone()
        language: "python"
        review_type: "security"
      expected_artifacts: ["review.json"]
    assertions:
      - type: "artifact_exists"
        config:
          path: "review.json"
      - type: "contains"
        config:
          path: "review.json"
          pattern: "injection"
          regex: false
      - type: "llm_eval"
        config:
          criteria: "completeness"
          threshold: 0.7
          instruction: "Check if the review correctly identifies SQL injection vulnerability in the get_user function"
